[project]
name = "hardware-comps-dashboard"
version = "0.1.0"
description = "Hardware comps dashboard: per-item eBay pricing, price history trends, RAM/SSD stockpile tracking."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.25"]
